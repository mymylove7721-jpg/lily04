<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 번역 → 음성</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 1000px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .bar.second { padding-top: 10px; border-top: 1px solid #1e293b; }
  button {
    padding: 10px 18px; border: 0; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; background: #334155; color: #e2e8f0;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #start { background: #22c55e; color: #052e16; }
  #stop  { background: #ef4444; color: #fff; }
  #speakAll { background: #3b82f6; color: #fff; }
  select { padding: 9px 12px; border-radius: 8px; border: 1px solid #334155;
           background: #1e293b; color: #e2e8f0; font-size: 14px; max-width: 220px; }
  label.chk { font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 5px; }
  .slider { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
  input[type=range] { width: 90px; }
  .status { font-size: 13px; color: #94a3b8; margin-bottom: 4px; min-height: 18px; }
  .tstatus { font-size: 12px; color: #64748b; margin-bottom: 10px; min-height: 16px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: #475569; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #22c55e; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 { font-size: 13px; color: #94a3b8; margin: 0 0 6px; font-weight: 600;
             text-transform: uppercase; letter-spacing: .5px; }
  .box {
    width: 100%; min-height: 300px; padding: 16px; border-radius: 10px;
    border: 1px solid #334155; background: #1e293b; color: #f1f5f9;
    font-size: 15px; line-height: 1.7; overflow-y: auto; max-height: 420px;
  }
  #translated { border-color: #1e40af; background: #172554; }
  .seg { cursor: pointer; border-radius: 4px; padding: 1px 3px; }
  .seg:hover { background: #1e3a8a; }
  .seg.speaking { background: #2563eb; color: #fff; }
  .interim { color: #64748b; font-style: italic; }
  .err { color: #f87171; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 → 텍스트 → 영어 번역 → 음성 출력</h1>
  <p class="sub">Web Speech API + Chrome 내장 Translator + SpeechSynthesis · 외부 API 키 불필요</p>

  <div class="bar">
    <button id="start">● 녹음 시작</button>
    <button id="stop" disabled>■ 중지</button>
    <select id="lang">
      <option value="ko-KR" data-src="ko">한국어</option>
      <option value="ja-JP" data-src="ja">日本語</option>
      <option value="zh-CN" data-src="zh">中文</option>
      <option value="es-ES" data-src="es">Español</option>
    </select>
    <label class="chk"><input type="checkbox" id="autoTrans" checked> 실시간 번역</label>
    <button id="copy">번역문 복사</button>
    <button id="clear">지우기</button>
  </div>

  <div class="bar second">
    <label class="chk"><input type="checkbox" id="autoSpeak" checked> 번역 즉시 읽기</label>
    <select id="voice"><option>음성 로딩 중...</option></select>
    <div class="slider">속도 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><span id="rateVal">1.0</span></div>
    <div class="slider">음높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><span id="pitchVal">1.0</span></div>
    <button id="speakAll">▶ 전체 읽기</button>
    <button id="stopSpeak">■ 읽기 중지</button>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>
  <div class="tstatus" id="transStatus">엔진 확인 중...</div>

  <div class="panes">
    <div class="pane">
      <h2>원문 (음성 인식)</h2>
      <div id="output" class="box" contenteditable="true" spellcheck="false"></div>
    </div>
    <div class="pane">
      <h2>English 번역 <span style="font-weight:400;text-transform:none">— 문장 클릭 시 재생</span></h2>
      <div id="translated" class="box"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const out = $('output'), trOut = $('translated');
  const statusText = $('statusText'), transStatus = $('transStatus'), dot = $('dot');
  const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

  /* ============ 1. TTS (SpeechSynthesis) ============ */
  let voices = [], speakQueue = [], speaking = false, speakingIdx = -1;

  function loadVoices() {
    voices = synth.getVoices().filter(v => v.lang.toLowerCase().startsWith('en'));
    const sel = $('voice');
    if (!voices.length) { sel.innerHTML = '<option value="-1">영어 음성 없음 (기본값 사용)</option>'; return; }
    sel.innerHTML = voices.map((v, i) =>
      `<option value="${i}">${esc(v.name)} (${v.lang})${v.default ? ' ★' : ''}</option>`).join('');
    // 자연스러운 음성 우선 선택
    const pref = voices.findIndex(v => /Google|Natural|Samantha|Aria/i.test(v.name));
    sel.value = pref >= 0 ? pref : 0;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function speak(text, idx) {
    if (!synth || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    const vi = parseInt($('voice').value, 10);
    if (voices[vi]) u.voice = voices[vi];
    u.lang  = voices[vi] ? voices[vi].lang : 'en-US';
    u.rate  = parseFloat($('rate').value);
    u.pitch = parseFloat($('pitch').value);

    u.onstart = () => { speaking = true; speakingIdx = idx; highlight(); };
    u.onend   = () => { speakingIdx = -1; highlight(); if (!synth.pending) speaking = false; };
    u.onerror = () => { speakingIdx = -1; highlight(); speaking = false; };
    synth.speak(u);
  }

  function speakAll() {
    synth.cancel();
    segments.forEach((s, i) => { if (s && s !== '[번역 실패]') speak(s, i); });
  }

  function stopSpeak() { synth.cancel(); speaking = false; speakingIdx = -1; highlight(); }

  function highlight() {
    [...trOut.querySelectorAll('.seg')].forEach((el, i) =>
      el.classList.toggle('speaking', i === speakingIdx));
  }

  /* ============ 2. 번역 엔진 ============ */
  let translator = null, translatorLang = null;

  async function ensureTranslator(src) {
    if (translator && translatorLang === src) return translator;
    if (!self.Translator) throw new Error('unsupported');
    transStatus.textContent = '번역 모델 준비 중 (' + src + ' → en)...';
    const avail = await self.Translator.availability({ sourceLanguage: src, targetLanguage: 'en' });
    if (avail === 'unavailable') throw new Error('이 언어쌍(' + src + '→en)은 지원되지 않습니다.');
    translator = await self.Translator.create({
      sourceLanguage: src, targetLanguage: 'en',
      monitor(m) {
        m.addEventListener('downloadprogress', e => {
          transStatus.textContent = '번역 모델 다운로드 ' + Math.round(e.loaded * 100) + '% (최초 1회)';
        });
      }
    });
    translatorLang = src;
    transStatus.textContent = '번역 엔진 준비 완료 (' + src + ' → en, 온디바이스)';
    return translator;
  }

  let queue = [], busy = false;
  async function enqueue(text, idx) {
    queue.push({ text, idx });
    if (busy) return;
    busy = true;
    while (queue.length) {
      const job = queue.shift();
      try {
        const t = await ensureTranslator(currentSrcLang());
        segments[job.idx] = await t.translate(job.text);
        if ($('autoSpeak').checked) speak(segments[job.idx], job.idx);   // ← 번역 즉시 읽기
      } catch (e) {
        segments[job.idx] = '[번역 실패]';
        if (e.message === 'unsupported') {
          transStatus.innerHTML = '<span class="warn">내장 번역 API 미지원 (Chrome 138+ 필요).</span>';
          $('autoTrans').checked = false; queue = [];
        } else {
          transStatus.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
        }
      }
      renderTranslation();
    }
    busy = false;
  }

  /* ============ 3. 상태 / 렌더 ============ */
  let recognition = null, manualStop = false, finalText = '', segments = [];
  const currentSrcLang = () => $('lang').selectedOptions[0].dataset.src;

  function render(interim) {
    out.innerHTML = esc(finalText) + (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
    out.scrollTop = out.scrollHeight;
  }
  function renderTranslation() {
    trOut.innerHTML = segments.map((s, i) =>
      `<span class="seg" data-i="${i}" title="클릭하면 읽어줍니다">${esc(s || '…')}</span>`).join(' ');
    highlight();
    trOut.scrollTop = trOut.scrollHeight;
  }

  trOut.addEventListener('click', e => {
    const el = e.target.closest('.seg');
    if (!el) return;
    const i = +el.dataset.i;
    synth.cancel();
    speak(segments[i], i);
  });

  /* ============ 4. 음성 인식 ============ */
  if (!SR) {
    statusText.innerHTML = '<span class="err">이 브라우저는 음성 인식을 지원하지 않습니다. Chrome / Edge 를 사용하세요.</span>';
    $('start').disabled = true;
  }

  function build() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      dot.classList.add('on');
      statusText.textContent = '듣는 중... 말씀하세요';
      $('start').disabled = true; $('stop').disabled = false;
    };

    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) {
          if (!t) continue;
          finalText += t + ' ';
          if ($('autoTrans').checked) {
            const idx = segments.length;
            segments.push('');
            renderTranslation();
            enqueue(t, idx);
          }
        } else interim += t;
      }
      render(interim);
    };

    r.onerror = e => {
      const msg = {
        'not-allowed': '마이크 권한이 거부되었습니다.',
        'no-speech': '음성이 감지되지 않았습니다.',
        'audio-capture': '마이크를 찾을 수 없습니다.',
        'network': '네트워크 오류가 발생했습니다.'
      }[e.error] || ('오류: ' + e.error);
      statusText.innerHTML = '<span class="err">' + msg + '</span>';
      if (e.error === 'not-allowed' || e.error === 'audio-capture') manualStop = true;
    };

    r.onend = () => {
      if (!manualStop) { try { r.start(); return; } catch (_) {} }
      dot.classList.remove('on');
      statusText.textContent = '정지됨';
      $('start').disabled = false; $('stop').disabled = true;
    };
    return r;
  }

  /* ============ 5. 이벤트 ============ */
  $('start').onclick = async () => {
    manualStop = false;
    if ($('autoTrans').checked) { try { await ensureTranslator(currentSrcLang()); } catch (_) {} }
    recognition = build();
    try { recognition.start(); }
    catch (e) { statusText.textContent = '시작 실패: ' + e.message; }
  };
  $('stop').onclick = () => { manualStop = true; if (recognition) recognition.stop(); };
  $('speakAll').onclick = speakAll;
  $('stopSpeak').onclick = stopSpeak;
  $('rate').oninput  = e => $('rateVal').textContent  = (+e.target.value).toFixed(1);
  $('pitch').oninput = e => $('pitchVal').textContent = (+e.target.value).toFixed(1);

  $('lang').onchange = () => {
    translator = null; translatorLang = null;
    if (recognition && !manualStop) { manualStop = true; recognition.stop(); }
    transStatus.textContent = '언어 변경됨 — 다시 시작하세요.';
  };

  $('clear').onclick = () => {
    stopSpeak(); finalText = ''; segments = []; render(''); renderTranslation();
  };

  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(trOut.innerText.trim());
      transStatus.textContent = '번역문이 클립보드에 복사되었습니다';
    } catch (_) { transStatus.textContent = '복사 실패 (수동 선택 후 복사하세요)'; }
  };

  out.addEventListener('input', () => { finalText = out.innerText; });
  window.addEventListener('beforeunload', () => synth && synth.cancel());

  /* ============ 6. 초기 체크 ============ */
  (async () => {
    if (!synth) transStatus.innerHTML = '<span class="warn">이 브라우저는 음성 합성을 지원하지 않습니다.</span>';
    if (!self.Translator) {
      transStatus.innerHTML = '<span class="warn">내장 번역 API 미지원 — Chrome 138+ 필요. 음성 인식은 정상 작동합니다.</span>';
      $('autoTrans').checked = false;
      return;
    }
    try {
      const a = await self.Translator.availability({ sourceLanguage: 'ko', targetLanguage: 'en' });
      transStatus.textContent = a === 'available'
        ? '번역 + 음성 엔진 사용 가능 (온디바이스)'
        : '번역 모델 최초 사용 시 자동 다운로드됩니다 (' + a + ')';
    } catch (e) {
      transStatus.innerHTML = '<span class="err">엔진 확인 실패: ' + esc(e.message) + '</span>';
    }
  })();
})();
</script>
</body>
</html>
